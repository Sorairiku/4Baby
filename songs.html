<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songs for Us</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <a class="back-link" href="menu.html">&larr; Back to menu</a>

    <main class="songs-page">
        <header class="songs-intro">
            <p class="gallery-kicker">A small soundtrack</p>
            <h1>Songs for us</h1>
            <p>Five Sora covers, plus the songs held by the story and the final message.</p>
        </header>

        <section class="songs-player" aria-label="Song player">
            <audio id="audioPlayer" preload="metadata">
                Your browser does not support the audio element.
            </audio>
            <p class="now-playing-label">Now playing</p>
            <h2 id="nowPlaying">A Million Dreams</h2>
            <p id="nowPlayingArtist">Sora cover</p>
            <div class="song-progress">
                <span id="currentTime">0:00</span>
                <input type="range" id="progressControl" min="0" max="0" step="0.1" value="0" aria-label="Song progress">
                <span id="duration">0:00</span>
            </div>
            <div class="song-controls">
                <button type="button" id="playButton" aria-label="Play selected song" title="Play selected song">&#9654;</button>
                <button type="button" id="pauseButton" aria-label="Pause selected song" title="Pause selected song">&#10074;&#10074;</button>
                <label for="volumeControl">Volume</label>
                <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="0.3" aria-label="Volume">
            </div>
        </section>

        <section class="song-list" aria-label="Song list">
            <button class="song-choice is-selected" type="button" data-src="songs/million.mp3" data-type="audio/mpeg" data-title="A Million Dreams" data-artist="Sora cover">
                <span class="song-number">01</span><span><strong>A Million Dreams</strong><small>Sora cover</small></span>
            </button>
            <button class="song-choice" type="button" data-src="songs/Higa.m4a" data-type="audio/mp4" data-title="Higa" data-artist="Sora cover">
                <span class="song-number">02</span><span><strong>Higa</strong><small>Sora cover</small></span>
            </button>
            <button class="song-choice" type="button" data-src="songs/Leaves.m4a" data-type="audio/mp4" data-title="Leaves" data-artist="Sora cover">
                <span class="song-number">03</span><span><strong>Leaves</strong><small>Sora cover</small></span>
            </button>
            <button class="song-choice" type="button" data-src="songs/Paraluman.m4a" data-type="audio/mp4" data-title="Paraluman" data-artist="Sora cover">
                <span class="song-number">04</span><span><strong>Paraluman</strong><small>Sora cover</small></span>
            </button>
            <button class="song-choice" type="button" data-src="songs/Sa susunod na habang buhay.m4a" data-type="audio/mp4" data-title="Sa susunod na habang buhay" data-artist="Sora cover">
                <span class="song-number">05</span><span><strong>Sa susunod na habang buhay</strong><small>Sora cover</small></span>
            </button>
            <button class="song-choice song-choice-story" type="button" data-src="songs/journey-placeholder.mp3" data-type="audio/mpeg" data-title="Kalapastangan" data-artist="fitterkarma · Story song">
                <span class="song-number">06</span><span><strong>Kalapastangan</strong><small>fitterkarma · Story song</small></span>
            </button>
            <button class="song-choice song-choice-message" type="button" data-src="songs/message3.mp3" data-type="audio/mpeg" data-title="Lifetime (Reimagined)" data-artist="Ben&Ben · Message 3 song">
                <span class="song-number">07</span><span><strong>Lifetime (Reimagined)</strong><small>Ben&Ben · Message 3 song</small></span>
            </button>
        </section>
    </main>

    <script>
        var audio = document.getElementById('audioPlayer');
        var playButton = document.getElementById('playButton');
        var pauseButton = document.getElementById('pauseButton');
        var volumeControl = document.getElementById('volumeControl');
        var nowPlaying = document.getElementById('nowPlaying');
        var nowPlayingArtist = document.getElementById('nowPlayingArtist');
        var progressControl = document.getElementById('progressControl');
        var currentTime = document.getElementById('currentTime');
        var duration = document.getElementById('duration');
        var songChoices = document.querySelectorAll('.song-choice');
        var isSongPlaying = false;

        function formatTime(seconds) {
            if (!Number.isFinite(seconds)) {
                return '0:00';
            }
            var minutes = Math.floor(seconds / 60);
            var remainingSeconds = Math.floor(seconds % 60).toString().padStart(2, '0');
            return minutes + ':' + remainingSeconds;
        }

        function selectSong(choice, shouldPlay) {
            isSongPlaying = shouldPlay;
            audio.src = choice.dataset.src;
            audio.type = choice.dataset.type;
            nowPlaying.textContent = choice.dataset.title;
            nowPlayingArtist.textContent = choice.dataset.artist;
            songChoices.forEach(function (song) {
                song.classList.toggle('is-selected', song === choice);
            });
            if (shouldPlay) {
                window.storyMusicPause();
                audio.play().catch(function () {
                    isSongPlaying = false;
                    window.storyMusicResume();
                });
            }
        }

        playButton.addEventListener('click', function () {
            isSongPlaying = true;
            window.storyMusicPause();
            audio.play().catch(function () {
                isSongPlaying = false;
                window.storyMusicResume();
            });
        });
        pauseButton.addEventListener('click', function () {
            isSongPlaying = false;
            audio.pause();
            window.storyMusicResume();
        });
        volumeControl.addEventListener('input', function () {
            audio.volume = Number(volumeControl.value);
        });
        audio.addEventListener('loadedmetadata', function () {
            progressControl.max = audio.duration;
            duration.textContent = formatTime(audio.duration);
        });
        audio.addEventListener('timeupdate', function () {
            progressControl.value = audio.currentTime;
            currentTime.textContent = formatTime(audio.currentTime);
        });
        audio.addEventListener('play', function () {
            isSongPlaying = true;
        });
        audio.addEventListener('pause', function () {
            if (!isSongPlaying) {
                window.storyMusicResume();
            }
        });
        audio.addEventListener('ended', function () {
            isSongPlaying = false;
            window.storyMusicResume();
        });
        progressControl.addEventListener('input', function () {
            audio.currentTime = Number(progressControl.value);
        });
        songChoices.forEach(function (choice) {
            choice.addEventListener('click', function () {
                selectSong(choice, true);
            });
        });

        audio.volume = 0.3;
        selectSong(document.querySelector('.song-choice.is-selected'), false);
    </script>
    <script src="music.js"></script>
    <script src="theme.js"></script>
</body>
</html>
